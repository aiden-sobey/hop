name: Preview environment

# Every branch gets its own environment at https://<branch>.preview.acme-readings.example.
# Re-run this workflow on a branch to redeploy its environment.

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency: preview-${{ github.ref_name }}

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: readings-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - id: meta
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          environment=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-20)
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "commit_timestamp=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: api
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - uses: hashicorp/setup-terraform@v3

      - name: Apply
        working-directory: infra/environments/preview
        env:
          ENVIRONMENT: ${{ steps.meta.outputs.environment }}
          TF_VAR_image_tag: ${{ github.sha }}
          TF_VAR_commit_sha: ${{ github.sha }}
          TF_VAR_commit_timestamp: ${{ steps.meta.outputs.commit_timestamp }}
          TF_VAR_deployed_by: ${{ github.actor }}
          TF_VAR_db_password: ${{ secrets.PREVIEW_DB_PASSWORD }}
          TF_VAR_certificate_arn: ${{ vars.PREVIEW_CERTIFICATE_ARN }}
        run: |
          terraform init -input=false
          terraform workspace select -or-create "$ENVIRONMENT"
          terraform apply -auto-approve -input=false
