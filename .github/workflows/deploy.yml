name: Deploy to production

on:
  push:
    branches: [main]
    paths: ["api/**"]

concurrency: deploy-prod

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: readings-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: api
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Roll out
        run: |
          aws ecs update-service \
            --cluster readings-prod \
            --service readings-api-prod \
            --force-new-deployment > /dev/null
          echo "Deployed ${GITHUB_SHA::7} to production :rocket:" >> "$GITHUB_STEP_SUMMARY"
